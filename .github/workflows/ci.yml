name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Conan 2
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0,<3.0" "gcovr>=8.0,<9.0"

      - name: Prepare build logs directory
        run: mkdir -p build/logs build/coverage build/performance build/classification

      - name: Detect Conan profile
        run: |
          set -o pipefail
          conan profile detect --force | tee build/logs/conan-profile.log

      - name: Build and run deterministic tests
        id: build_and_test
        continue-on-error: true
        run: |
          set -euo pipefail
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Debug | tee build/logs/conan-install.log
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPROJECT_BOOST_ENABLE_COVERAGE=ON | tee build/logs/cmake-configure.log
          cmake --build build --config Debug | tee build/logs/cmake-build.log
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit build/ctest-results.xml | tee build/logs/ctest.log

      - name: Collect and evaluate coverage
        id: coverage_gate
        if: always() && steps.build_and_test.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          gcovr \
            --root . \
            --object-directory build \
            --filter '^.*/(src|include)/' \
            --json build/coverage/coverage.json \
            --xml build/coverage/cobertura.xml \
            --xml-pretty \
            --txt build/coverage/summary.txt
          python3 scripts/evaluate_coverage.py \
            --coverage-json build/coverage/coverage.json \
            --gates-config config/quality-gates.json \
            --report-output build/coverage/coverage-gate.json \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" | tee build/logs/coverage-gate.log

      - name: Evaluate performance budgets
        id: performance_gate
        if: always() && steps.build_and_test.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cp build/performance-results.json build/performance/performance-results.json
          python3 scripts/evaluate_performance.py \
            --results-json build/performance/performance-results.json \
            --gates-config config/quality-gates.json \
            --report-output build/performance/performance-gate.json | tee build/logs/performance-gate.log

      - name: Run policy and audit tests
        if: always()
        run: |
          set -o pipefail
          python3 tests/policy/run_policy_tests.py --output build/policy-test-results.json | tee build/logs/policy-tests.log

      - name: Classify failure for self-heal routing
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/classify_ci_failure.py \
            --build-outcome "${{ steps.build_and_test.outcome }}" \
            --coverage-outcome "${{ steps.coverage_gate.outcome || 'skipped' }}" \
            --performance-outcome "${{ steps.performance_gate.outcome || 'skipped' }}" \
            --coverage-report build/coverage/coverage-gate.json \
            --performance-report build/performance/performance-gate.json \
            --output build/classification/failure-classification.json | tee build/logs/failure-classification.log

      - name: Enforce deterministic quality gates
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.build_and_test.outcome }}" != "success" ] || \
             [ "${{ steps.coverage_gate.outcome || 'skipped' }}" = "failure" ] || \
             [ "${{ steps.performance_gate.outcome || 'skipped' }}" = "failure" ]; then
            echo "CI failed deterministic quality gates."
            cat build/classification/failure-classification.json
            exit 1
          fi

      - name: Publish quality summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## CI Quality Gate Summary"
            echo
            echo "- Build and functional tests: ${{ steps.build_and_test.outcome }}"
            echo "- Coverage gate: ${{ steps.coverage_gate.outcome || 'skipped' }}"
            echo "- Performance gate: ${{ steps.performance_gate.outcome || 'skipped' }}"
            if [ -f build/classification/failure-classification.json ]; then
              echo "- Failure classification artifact: build/classification/failure-classification.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            build/logs
            build/ctest-results.xml
            build/policy-test-results.json
            build/coverage
            build/performance
            build/classification
